name: CLA Assistant

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - closed
      - synchronize

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' && github.event.comment.body == 'recheck')
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/trunk/CLA.md"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],dependabot-preview[bot],github-actions[bot],mistachkin"
          custom-notsigned-prcomment: >-
            Thank you for your pull request!  Before we can merge it we need
            you to sign our
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/trunk/CLA.md).
            Please read the CLA and then post the following comment to
            indicate your agreement:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
