name: Eagle Test Suite

on:
  push:
    branches: [trunk]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event.pull_request.draft != true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    env:
      EAGLE_ROOT: ${{ github.workspace }}
      SCRIPT_ROOT: ${{ github.workspace }}/.github/eagle/suites

    steps:
      - name: Checkout the Eagle repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup the .NET 10 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Touch core embedded resources to skip ResGen (Windows only)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          IF EXIST Library\Resources\library.resources COPY /B Library\Resources\library.resources +,, Library\Resources\library.resources
          IF EXIST Library\Resources\messages.resources COPY /B Library\Resources\messages.resources +,, Library\Resources\messages.resources
          IF EXIST Library\Resources\packages.resources COPY /B Library\Resources\packages.resources +,, Library\Resources\packages.resources
          IF EXIST Sample\Resources\packages.resources COPY /B Sample\Resources\packages.resources +,, Sample\Resources\packages.resources

      - name: Install Mono for its strong name tool (macOS only)
        if: runner.os == 'macOS'
        run: brew install mono

      - name: Install Tcl 8 for native integration tests (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install tcl-tk@8
          echo "$(brew --prefix tcl-tk@8)/bin" >> "$GITHUB_PATH"
          echo "Eagle_Tcl_Dir=$(brew --prefix tcl-tk@8)/lib" >> "$GITHUB_ENV"

      - name: Install signed IronTcl for native Tcl tests (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.irontcl.com/downloads/irontcl-amd64-8.6.7.zip"
          $zip = Join-Path $env:RUNNER_TEMP "irontcl-amd64.zip"
          $dst = Join-Path $env:RUNNER_TEMP "irontcl"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $bin = Join-Path $dst "IronTcl\bin"
          $dll = Join-Path $bin "tcl86t.dll"
          if (-not (Test-Path $dll)) { throw "IronTcl runtime not found at $dll" }
          $sig = Get-AuthenticodeSignature $dll
          Add-Content -Path $env:GITHUB_ENV -Value "Eagle_Tcl_Dir=$bin"
          Write-Host "IronTcl tcl86t.dll: status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"

      - name: Install Tcl 8.6 for native integration tests (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl8.6-dev tcl
          echo "Eagle_Tcl_Dir=/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Enable BigRSACryptoServiceProvider (macOS only)
        if: runner.os == 'macOS'
        run: echo "UseBigCrypto=1" >> "$GITHUB_ENV"

      - name: Set DOTNET_SDK_VERSION so build-native runs (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for base in "$DOTNET_ROOT/packs" /usr/local/share/dotnet/packs /usr/share/dotnet/packs /usr/lib/dotnet/packs; do
            pack=$(ls -d "$base"/Microsoft.NETCore.App.Host.*/ 2>/dev/null | head -1) || true
            [ -n "$pack" ] && break
          done
          ver=$(ls "$pack" 2>/dev/null | grep '^10\.' | sort -V | tail -1) || true
          [ -n "$ver" ] || { echo "no 10.x AppHost pack found under any dotnet packs dir; build-native would skip/fail"; exit 1; }
          echo "DOTNET_SDK_VERSION=$ver" >> "$GITHUB_ENV"
          echo "build-native will use host-pack version: $ver"

      - name: Setup test BATCH_ID
        shell: bash
        run: |
          BATCH_ID=$(openssl rand -hex 32 | tr 'a-f' 'A-F')
          [[ "$BATCH_ID" =~ ^[0-9A-F]{64}$ ]] || { echo "failed to setup a valid BATCH_ID"; exit 1; }
          echo "BATCH_ID=$BATCH_ID" >> "$GITHUB_ENV"
          echo "test batch id: $BATCH_ID"

      - name: Build core projects (for link tool)
        run: make build-core

      - name: Run the link tool
        run: make run SHELL_DLL_ARGS="-file ./eee/Tools/link.eagle"

      - name: Touch plugin embedded resources to skip ResGen (Windows only)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          IF EXIST Plugins\Commercial\Enterprise\Badge\Generated\plugin.resources COPY /B Plugins\Commercial\Enterprise\Badge\Generated\plugin.resources +,, Plugins\Commercial\Enterprise\Badge\Generated\plugin.resources
          IF EXIST Plugins\Commercial\Enterprise\Zeus\Generated\library.resources COPY /B Plugins\Commercial\Enterprise\Zeus\Generated\library.resources +,, Plugins\Commercial\Enterprise\Zeus\Generated\library.resources

      - name: Build all projects
        run: make rebuild

      - name: Build Garuda native package (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vs) { throw "Visual Studio not found via vswhere" }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -DevCmdArguments '-arch=x64' -SkipAutomaticLocation
          $env:DOTNET_SDK_PACKS_DIR = if ($env:DOTNET_ROOT) { Join-Path $env:DOTNET_ROOT 'packs' } else { Join-Path $env:ProgramFiles 'dotnet\packs' }
          $hostPack = Join-Path $env:DOTNET_SDK_PACKS_DIR 'Microsoft.NETCore.App.Host.win-x64'
          $ver = Get-ChildItem $hostPack -Directory -Name -ErrorAction SilentlyContinue | Where-Object { $_ -like '10.*' } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $ver) { throw "no 10.x win-x64 AppHost pack under $hostPack" }
          $env:DOTNET_SDK_VERSION = $ver
          $env:NOSIGN = "1"
          msbuild Native\Package\GarudaNetStandard21.vcxproj /maxcpucount:1 /property:Configuration=DebugDll /property:Platform=x64 /property:EagleBuildType=NetStandard21 /property:EaglePatchLevel=false
          if ($LASTEXITCODE -ne 0) { throw "Garuda build failed (exit $LASTEXITCODE)" }
          $out = "bin\x64\DebugDllNetStandard21"
          $shellDir = "bin\DebugNetStandard21\bin\netcoreapp3.0"
          Copy-Item "$out\GarudaCore.dll" $shellDir
          Copy-Item "$out\*.tcl" $shellDir
          Write-Host "Garuda: host-pack $ver, packs=$env:DOTNET_SDK_PACKS_DIR"

      - name: Build System.Data.SQLite assemblies (macOS only)
        if: runner.os == 'macOS'
        run: |
          SDS="$RUNNER_TEMP/System.Data.SQLite"
          git clone --depth 1 https://github.com/mistachkin/System.Data.SQLite "$SDS"
          cd "$SDS/sqlite/dotnet"
          dotnet build ./SQLite.NET.NetStandard21.MSBuild.sln /maxCpuCount:1
          sn -R ./bin/NetStandard21/DebugNetStandard21/bin/netstandard2.1/System.Data.SQLite.dll ./Keys/System.Data.SQLite.snk
          SQLITE_NET_ARCH="$(uname -m)" ./Setup/compile-interop-assembly-debug.sh
          echo "SQLITE_NET_ROOT=$SDS/sqlite/dotnet" >> "$GITHUB_ENV"

      - name: Place System.Data.SQLite assemblies next to Eagle (macOS only)
        if: runner.os == 'macOS'
        run: |
          BIN="$GITHUB_WORKSPACE/bin/DebugNetStandard21/bin/netcoreapp3.0"
          cp "$SQLITE_NET_ROOT/bin/NetStandard21/DebugNetStandard21/bin/netstandard2.1/System.Data.SQLite.dll" "$BIN/"
          if [ "$RUNNER_OS" = "macOS" ]; then ext=dylib; else ext=so; fi
          cp "$SQLITE_NET_ROOT/bin/2013/Debug/bin/SQLite.Interop.dll" "$BIN/SQLite.Interop.dll.$ext"

      - name: Run test suite
        env:
          EAGLE_TEST_TEMP: ${{ runner.temp }}
          logRemoteMessagePassword: ${{ secrets.LOG_REMOTE_MESSAGE_PASSWORD }}
        run: make test

      - name: Run plugin test suites
        shell: bash
        env:
          EAGLE_TEST_TEMP: ${{ runner.temp }}
          logRemoteMessagePassword: ${{ secrets.LOG_REMOTE_MESSAGE_PASSWORD }}
        run: |
          status=0
          for f in \
            Plugins/Commercial/Enterprise/Harpy/Tests/all.eagle \
            Plugins/Commercial/Enterprise/Badge/Tests/all.eagle \
            Plugins/Commercial/Enterprise/Zeus/Tests/all.eagle \
            Plugins/Commercial/Enterprise/Demo/Tests/all.eagle; do
            name=${f#Plugins/}; name=${name%/Tests/all.eagle}
            if [ -f "$f" ]; then
              echo "::group::$name"
              make test TEST_FILE="$f" || status=$?
              echo "::endgroup::"
            else
              echo "skipping $name (not present in this checkout)"
            fi
          done
          exit $status
