name: Eagle Test Suite

on:
  push:
    branches: [trunk]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event.pull_request.draft != true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300

    env:
      EAGLE_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout the Eagle repository
        uses: actions/checkout@v4

      - name: Setup the .NET 10 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the managed projects
        run: make build-managed

      - name: Run the test suite
        env:
          EAGLE_TEST_TEMP: ${{ runner.temp }}
          logRemoteMessagePassword: ${{ secrets.LOG_REMOTE_MESSAGE_PASSWORD }}
        run: make test
